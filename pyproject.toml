[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-reviewer"
version = "0.1.0"

authors = [
  { name = "Hari R", email = "hari@example.com" },
]

maintainers = [
  { name = "Hari R", email = "hari@example.com" },
]

description = "GitHub-native AI code review and security assistant built on the PR-Agent foundation with a custom orchestration layer."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["AI", "Agents", "Pull Request", "Automation", "Code Review", "Security"]
license = { file = "LICENSE" }

classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
]
dynamic = ["dependencies"]


[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.urls]
"Homepage" = "https://github.com/Hhari1234/ai-code-reviewer"
"Documentation" = "https://github.com/Hhari1234/ai-code-reviewer"
"Repository" = "https://github.com/Hhari1234/ai-code-reviewer"
"Issues" = "https://github.com/Hhari1234/ai-code-reviewer/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "pr_agent*",
  "reviewer*",
  "api*",
]

[project.scripts]
pr-agent = "pr_agent.cli:run"
ai-code-reviewer = "reviewer.cli:main"

[tool.ruff]
line-length = 120

exclude = ["tests", "pr_agent"]

# Limit lint checks to import-order/isort-related checks to avoid test-only and environment-specific lints during CI E2E verification
lint.select = [
  "I001", # isort basic checks
  "I002", # isort missing-required-import
]

# First commit - only fixing isort
lint.fixable = [
  "I001", # isort basic checks
]

lint.unfixable = [
  "B", # Avoid trying to fix flake8-bugbear (`B`) violations.
]

lint.exclude = ["api/code_completions", "tests", "pr_agent"]

lint.ignore = ["E999", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "E402",
] # Ignore `E402` (import violations) in all `__init__.py` files, and in `path/to/file.py`.

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
tests = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--color=yes"
console_output_style = "progress"
